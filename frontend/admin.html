<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FreshCV – Admin Panel</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .stats{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
    .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;min-width:150px;flex:1}
    .stat b{display:block;font-size:26px}
    .stat span{font-size:12px;color:var(--mute)}
    .tblwrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:14px}
    th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
    th{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}
    tbody tr:last-child td{border-bottom:0}
    tbody tr:hover{background:rgba(127,127,127,.07)}
    .badge{background:#dbeafe;color:#1d4ed8;border-radius:99px;padding:1px 9px;font-size:11px;font-weight:700}
    body[data-theme=dark] .badge{background:#1d4ed8;color:#eff6ff}
    .acts{display:flex;gap:6px;justify-content:flex-end}
    .acts .btn{padding:5px 12px;font-size:13px}
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
    .modal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;width:min(430px,100%);box-shadow:0 20px 60px rgba(0,0,0,.4)}
    .modal h3{margin:0 0 14px}
    .modal label{margin-bottom:12px}
    .auth .muted b{color:var(--ink)}
    .auth a.link{text-decoration:none}
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="toast"></div>
  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
